[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saferoll"
version = "0.6.0"
description = "Deterministic SafeRoll rollout policies and experimental decision evaluation"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["saferoll*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
