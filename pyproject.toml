[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saferoll"
version = "0.7.0"
description = "SafeRoll rollout experiments with deterministic mock and measured CPU inference"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["saferoll*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not real_backend"]
markers = ["real_backend: requires pinned GGUF model, llama-server and local socket access"]
